<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单核验卡 · 三维问路 SceneGuide</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { --bg:#070b16; --card:rgba(255,255,255,.045); --border:rgba(255,255,255,.12); --cyan:#22d3a6; --blue:#2f7bff; --dim:#98a3c2; --faint:#66708d; --text:#e9edf8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:
      radial-gradient(700px 420px at 75% -10%, rgba(47,123,255,.16), transparent 62%),
      radial-gradient(560px 360px at 10% 8%, rgba(34,211,166,.09), transparent 60%), var(--bg);
      color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; padding:24px; }
    .card { width:100%; max-width:480px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px; }
    .brand { display:flex; align-items:center; gap:9px; font-weight:700; margin-bottom:20px; font-size:15px; }
    .brand .mark { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,var(--blue),var(--cyan)); display:grid; place-items:center; font-size:12px; font-weight:800; color:#04122b; }
    .badge { display:inline-flex; align-items:center; gap:7px; padding:5px 13px; border-radius:999px; font-size:12.5px; margin-bottom:18px; }
    .badge.ok { background:rgba(34,211,166,.13); color:var(--cyan); border:1px solid rgba(34,211,166,.35); }
    .badge.bad { background:rgba(255,176,32,.12); color:#ffb020; border:1px solid rgba(255,176,32,.35); }
    h1 { margin:0 0 6px; font-size:20px; letter-spacing:-0.02em; }
    .goods { color:var(--dim); font-size:13.5px; margin-bottom:20px; }
    table { width:100%; border-collapse:collapse; font-size:13.5px; margin-bottom:18px; }
    td { padding:9px 0; border-bottom:1px solid rgba(255,255,255,.07); vertical-align:top; }
    td.k { color:var(--faint); width:5.5em; white-space:nowrap; }
    td.v { text-align:right; font-variant-numeric:tabular-nums; word-break:break-all; }
    .hash { color:var(--cyan); font-weight:600; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
    .amount { color:var(--cyan); font-weight:700; font-size:15px; }
    .explain { background:rgba(34,211,166,.07); border:1px solid rgba(34,211,166,.2); border-radius:10px; padding:12px 14px; font-size:12.5px; color:var(--dim); line-height:1.7; margin-bottom:20px; }
    .explain b { color:var(--cyan); }
  .cta { display:block; text-align:center; background:linear-gradient(135deg,var(--blue),#1f5fd8); color:#fff; text-decoration:none; font-weight:600; font-size:14.5px; padding:13px; border-radius:11px; }
  .cta:hover { filter:brightness(1.08); }
  .cta-row { display:flex; gap:10px; margin-top:4px; }
  .cta-row .cta { flex:1; }
  .cta-ghost { display:block; text-align:center; background:var(--card); border:1px solid var(--border); color:var(--dim); text-decoration:none; font-weight:600; font-size:13px; padding:12px; border-radius:11px; cursor:pointer; font-family:inherit; }
  .cta-ghost:hover { color:var(--text); border-color:rgba(255,255,255,.24); }
    .foot { margin-top:16px; text-align:center; font-size:11.5px; color:var(--faint); }
    .err { text-align:center; padding:30px 0 10px; color:var(--dim); font-size:14px; line-height:1.8; }
    .num { font-variant-numeric:tabular-nums; }

    /* ── 官方作品页分享块（影响力 20% 的落点）── */
    .official { margin-top:18px; padding:16px; border-radius:13px; display:flex; gap:14px; align-items:center;
      background:linear-gradient(135deg, rgba(47,123,255,.12), rgba(34,211,166,.08));
      border:1px solid rgba(63,140,255,.28); }
    .official .qr { flex:none; width:96px; height:96px; background:#fff; border-radius:6px; padding:8px;
      display:grid; place-items:center; overflow:hidden; }
    .official .qr svg { width:100%; height:100%; display:block; }
    .official .ot { font-size:13.5px; font-weight:700; line-height:1.5; margin-bottom:5px; }
    .official .on { font-size:12px; color:var(--dim); line-height:1.6; margin-bottom:9px; }
    .official .ol { font-size:11.5px; color:var(--faint); word-break:break-all; font-family:ui-monospace,Menlo,Consolas,monospace; }
    .official .olink { display:inline-block; margin-top:9px; font-size:13px; font-weight:600; color:#9fd0ff; text-decoration:none;
      border:1px solid rgba(63,140,255,.35); border-radius:9px; padding:7px 13px; }
    .official .olink:hover { filter:brightness(1.15); }

  /* ── 收据打印态：白纸黑字 + 双线框，其余一律隐藏 ── */
  #receiptCard { display:none; }
  body.printing-receipt { background:#fff; padding:0; }
  body.printing-receipt .card { background:#fff; border:0; box-shadow:none; max-width:none; padding:0; }
  body.printing-receipt .card > *:not(#receiptCard) { display:none !important; }
  body.printing-receipt #receiptCard { display:block; color:#111; }
  body.printing-receipt #receiptCard * { color:#111; }
  .rcp { border:2.5px double #0e7a63; border-radius:4px; padding:16mm 14mm; }
  .rcp-head { display:flex; align-items:baseline; justify-content:space-between; border-bottom:1.5px solid #0e7a63; padding-bottom:8px; margin-bottom:14px; }
  .rcp-title { font-size:20px; font-weight:800; letter-spacing:.02em; }
  .rcp-no { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:#555; }
  .rcp-row { display:flex; gap:14px; padding:7px 0; border-bottom:1px dotted #bbb; font-size:13.5px; }
  .rcp-row .k { color:#555; min-width:6.5em; }
  .rcp-row .v { flex:1; word-break:break-all; }
  .rcp-hash { color:#0e7a63; font-weight:600; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
  .rcp-foot { margin-top:16px; font-size:11px; color:#666; line-height:1.8; }
  @media print {
    body { background:#fff; padding:0; }
    .card { box-shadow:none; border:0; }
  }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="mark">三</span>三维问路 · SceneGuide</div>
    <div id="body"><div class="err">正在核验…</div></div>
    <!-- 收据打印态：由 JS 填充后整页只留这一张（见 @media print / body.printing-receipt） -->
    <div id="receiptCard" aria-hidden="true"></div>
  </div>
  <script>
    // 核验卡：?t=<out_trade_no>
    // 相对路径取数，任何子路径/域名下都成立；不带任何买家信息（设计上就没存）。
    const id = new URLSearchParams(location.search).get('t')?.trim();
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const $ = (h) => { document.getElementById('body').innerHTML = h; };

    if (!id) {
      $('<div class="err">缺少订单号。<br/>核验卡链接形如 verify.html?t=SG_…</div>');
    } else {
      fetch(`api/v1/verify/${encodeURIComponent(id)}`)
        .then(async (res) => {
          const j = await res.json().catch(() => ({}));
          if (!res.ok) {
            $(`<div class="badge bad">⚠ 无法核验</div>
               <h1>${esc(j.message ?? '订单不可核验')}</h1>
               <div class="goods">订单号 ${esc(id)}</div>
               <div class="explain">只有<b>已支付且已履约</b>的订单会出具核验卡。如果你刚完成支付，请等交付完成后再打开。</div>
               <a class="cta" href="./?ref=share">我也要问</a>`);
            return;
          }
          const s = j.summary ?? {};
          const rows = s.kind === 'quest'
            ? `<tr><td class="k">交付物</td><td class="v">场景任务 · ${esc(s.title ?? '')}</td></tr>
               <tr><td class="k">站点</td><td class="v num">${esc(s.checkpoints)} 站</td></tr>
               <tr><td class="k">总里程</td><td class="v num">${esc(s.total_distance_m)} m</td></tr>`
            : `<tr><td class="k">路线</td><td class="v">${esc(s.from)} → ${esc(s.to)}</td></tr>
               <tr><td class="k">距离</td><td class="v num">${esc(s.distance_m)} m（${esc(s.path_type) === 'walkway' ? '实测步道' : '直距估算'}）</td></tr>`;
          $(`
            <div class="badge ok">✓ 已核验 · 支付宝 A2M 履约完成</div>
            <h1>${esc(j.scene ?? '')}${j.scene ? ' · ' : ''}导览服务</h1>
            <div class="goods">${esc(j.goods_name)}</div>
            <table>
              ${rows}
              <tr><td class="k">实付金额</td><td class="v amount num">¥${esc(j.amount)} ${esc(j.currency)}</td></tr>
              <tr><td class="k">交易号</td><td class="v mono num">${esc(j.trade_no_masked)}（尾号，已脱敏）</td></tr>
              <tr><td class="k">履约时间</td><td class="v num">${esc(String(j.fulfilled_at ?? '').slice(0, 19).replace('T', ' '))} UTC</td></tr>
              <tr><td class="k">证据哈希</td><td class="v hash">${esc(j.evidence?.geometryHash ?? '—')}</td></tr>
              <tr><td class="k">用量</td><td class="v num">${esc(Object.entries(j.usage ?? {}).map(([k, v]) => `${k} ${v}`).join(' · ') || '—')}</td></tr>
              ${j.settlement_url ? `<tr><td class="k">用量结算单</td><td class="v"><a href="${esc(j.settlement_url)}" target="_blank" rel="noopener" style="color:#9fd0ff;font-weight:600;text-decoration:none;">已出具（RSA2 签名）· 查看原文 ↗</a></td></tr>` : ''}
            </table>
            <div class="explain">
              这张卡由商家服务端出具：<b>证据哈希</b>覆盖真实路网拓扑的节点与边，
              任何人可复算；交易号已脱敏，卡上不含任何个人信息。
              完整路线内容仍属付费交付——核验的是「这笔交易真实发生」，不是内容本身。
              本单的<b>用量结算单</b>随交易一同出具（规范语句 + 商家 RSA2 签名 + 公钥）：
              第三方可用 openssl 离线验签，对 statement 任何字段的篡改验签必红。
            </div>
            <a class="cta" href="./?ref=share">${esc(j.cta?.message ?? '我也要问')}</a>
            ${officialBlock(j.official)}
            <div class="cta-row">
              <button type="button" class="cta-ghost" id="receiptBtn">打印收据（可报销留档）</button>
            </div>
            <div class="foot">三维问路 SceneGuide · PAYATHON 2026 · OpenStreetMap © OSM contributors (ODbL)</div>`);
          bindReceiptButton(j);
        })
        .catch(() => $('<div class="err">核验服务暂时不可用，请稍后再试。</div>'));
    }

    /**
     * 官方作品页分享块。
     *
     * 为什么在核验卡上放这个（2026-11-24 核实官方细则后新增）：
     *   官方《活动细则》：「作品影响力 20% = 参赛作品详情页在支付宝 AI 付官网的
     *   浏览、点赞、评论等互动量综合评定」——**我们自己站的流量不计入**。
     *   买家愿意晒的恰恰就是这张核验卡/收据 ⇒ 把它变成一个「引流到官方作品页」的载体，
     *   一次分享同时喂养商业化分（真人付费）与影响力分（官方页浏览/点赞/评论）。
     *
     *   服务端未配置官方作品页 URL 时（提交并审核通过前）整块不渲染 —— 优雅降级。
     */
    function officialBlock(o) {
      if (!o || !o.url) return '';
      const qr = o.qrSvg
        ? `<div class="qr" aria-label="官方作品页二维码">${o.qrSvg}</div>`
        : '';
      return `
        <div class="official">
          ${qr}
          <div>
            <div class="ot">${esc(o.title ?? '')}</div>
            <div class="on">${esc(o.note ?? '')}${o.note ? '<br/>' : ''}${esc(o.cta ?? '')}</div>
            <div class="ol">${esc(o.url)}</div>
            <a class="olink" href="${esc(o.url)}" target="_blank" rel="noopener noreferrer">打开作品页 →</a>
          </div>
        </div>`;
    }

    /** 收据打印版里的官方作品页行（白底二维码，保证打印可扫） */
    function receiptOfficial(o) {
      if (!o || !o.url) return '';
      const qr = o.qrSvg
        ? `<div style="display:inline-block;background:#fff;border:1px solid #bbb;border-radius:4px;padding:3px;margin:4px 6px 0 0;vertical-align:top">${o.qrSvg}</div>`
        : '';
      return `<div style="margin-top:10px;border-top:1px dotted #bbb;padding-top:8px">
        ${qr}<span style="font-size:11px;color:#444">支付宝 AI 付黑客松参赛作品：<br/>
        <span style="font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all">${esc(o.url)}</span><br/>
        ${esc(o.note ?? '')}${esc(o.cta ?? '')}</span></div>`;
    }

    /** 打印收据：同一份核验数据排成正式收据版式，打印时整页只留它 */
    function bindReceiptButton(j) {
      const btn = document.getElementById('receiptBtn');
      if (!btn) return;
      btn.addEventListener('click', () => {
        const s = j.summary ?? {};
        const detail = s.kind === 'quest'
          ? [['交付物', `场景任务 · ${esc(s.title ?? '')}`], ['打卡站点', `${esc(s.checkpoints)} 站`], ['总里程', `${esc(s.total_distance_m)} m`]]
          : [['路线', `${esc(s.from)} → ${esc(s.to)}`], ['距离', `${esc(s.distance_m)} m（${esc(s.path_type) === 'walkway' ? '实测步道' : '直距估算'}）`]];
        const usage = Object.entries(j.usage ?? {}).map(([k, v]) => `${k} ${v}`).join(' · ') || '—';
        document.getElementById('receiptCard').innerHTML = `
        <div class="rcp">
          <div class="rcp-head">
            <span class="rcp-title">交易收据</span>
            <span class="rcp-no">三维问路 SceneGuide · PAYATHON 2026</span>
          </div>
          <div class="rcp-row"><span class="k">商品</span><span class="v">${esc(j.goods_name ?? '')}</span></div>
          ${detail.map(([k, v]) => `<div class="rcp-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
          <div class="rcp-row"><span class="k">实付金额</span><span class="v"><b>¥${esc(j.amount)} ${esc(j.currency)}</b></span></div>
          <div class="rcp-row"><span class="k">交易号</span><span class="v">${esc(j.trade_no_masked)}（尾号，已脱敏）</span></div>
          <div class="rcp-row"><span class="k">商户订单号</span><span class="v">${esc(id)}</span></div>
          <div class="rcp-row"><span class="k">履约时间</span><span class="v">${esc(String(j.fulfilled_at ?? '').slice(0, 19).replace('T', ' '))} UTC</span></div>
          <div class="rcp-row"><span class="k">用量计量</span><span class="v">${esc(usage)}</span></div>
          <div class="rcp-row"><span class="k">证据哈希</span><span class="v rcp-hash">${esc(j.evidence?.geometryHash ?? '—')}</span></div>
          <div class="rcp-foot">
            本收据由商家服务端基于真实履约记录出具：证据哈希覆盖真实路网拓扑的节点与边，任何人可复算；
            交易号已脱敏，不含任何个人信息。完整路线内容仍属付费交付——核验的是「这笔交易真实发生」，不是内容本身。<br/>
            支付通道：支付宝 AI 付 A2M 智能收（HTTP 402 按量付费）｜ 场景数据 © OpenStreetMap contributors (ODbL)
            ${receiptOfficial(j.official)}
          </div>
        </div>`;
        document.body.classList.add('printing-receipt');
        const cleanup = () => {
          document.body.classList.remove('printing-receipt');
          window.removeEventListener('afterprint', cleanup);
        };
        window.addEventListener('afterprint', cleanup);
        window.print();
        setTimeout(cleanup, 1500);
      });
    }
  </script>
</body>
</html>
