<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单核验卡 · 三维问路 SceneGuide</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { --bg:#070b16; --card:rgba(255,255,255,.045); --border:rgba(255,255,255,.12); --cyan:#22d3a6; --blue:#2f7bff; --dim:#98a3c2; --faint:#66708d; --text:#e9edf8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:
      radial-gradient(700px 420px at 75% -10%, rgba(47,123,255,.16), transparent 62%),
      radial-gradient(560px 360px at 10% 8%, rgba(34,211,166,.09), transparent 60%), var(--bg);
      color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; padding:24px; }
    .card { width:100%; max-width:480px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px; }
    .brand { display:flex; align-items:center; gap:9px; font-weight:700; margin-bottom:20px; font-size:15px; }
    .brand .mark { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,var(--blue),var(--cyan)); display:grid; place-items:center; font-size:12px; font-weight:800; color:#04122b; }
    .badge { display:inline-flex; align-items:center; gap:7px; padding:5px 13px; border-radius:999px; font-size:12.5px; margin-bottom:18px; }
    .badge.ok { background:rgba(34,211,166,.13); color:var(--cyan); border:1px solid rgba(34,211,166,.35); }
    .badge.bad { background:rgba(255,176,32,.12); color:#ffb020; border:1px solid rgba(255,176,32,.35); }
    h1 { margin:0 0 6px; font-size:20px; letter-spacing:-0.02em; }
    .goods { color:var(--dim); font-size:13.5px; margin-bottom:20px; }
    table { width:100%; border-collapse:collapse; font-size:13.5px; margin-bottom:18px; }
    td { padding:9px 0; border-bottom:1px solid rgba(255,255,255,.07); vertical-align:top; }
    td.k { color:var(--faint); width:5.5em; white-space:nowrap; }
    td.v { text-align:right; font-variant-numeric:tabular-nums; word-break:break-all; }
    .hash { color:var(--cyan); font-weight:600; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
    .amount { color:var(--cyan); font-weight:700; font-size:15px; }
    .explain { background:rgba(34,211,166,.07); border:1px solid rgba(34,211,166,.2); border-radius:10px; padding:12px 14px; font-size:12.5px; color:var(--dim); line-height:1.7; margin-bottom:20px; }
    .explain b { color:var(--cyan); }
    .cta { display:block; text-align:center; background:linear-gradient(135deg,var(--blue),#1f5fd8); color:#fff; text-decoration:none; font-weight:600; font-size:14.5px; padding:13px; border-radius:11px; }
    .cta:hover { filter:brightness(1.08); }
    .foot { margin-top:16px; text-align:center; font-size:11.5px; color:var(--faint); }
    .err { text-align:center; padding:30px 0 10px; color:var(--dim); font-size:14px; line-height:1.8; }
    .num { font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="mark">三</span>三维问路 · SceneGuide</div>
    <div id="body"><div class="err">正在核验…</div></div>
  </div>
  <script>
    // 核验卡：?t=<out_trade_no>
    // 相对路径取数，任何子路径/域名下都成立；不带任何买家信息（设计上就没存）。
    const id = new URLSearchParams(location.search).get('t')?.trim();
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const $ = (h) => { document.getElementById('body').innerHTML = h; };

    if (!id) {
      $('<div class="err">缺少订单号。<br/>核验卡链接形如 verify.html?t=SG_…</div>');
    } else {
      fetch(`api/v1/verify/${encodeURIComponent(id)}`)
        .then(async (res) => {
          const j = await res.json().catch(() => ({}));
          if (!res.ok) {
            $(`<div class="badge bad">⚠ 无法核验</div>
               <h1>${esc(j.message ?? '订单不可核验')}</h1>
               <div class="goods">订单号 ${esc(id)}</div>
               <div class="explain">只有<b>已支付且已履约</b>的订单会出具核验卡。如果你刚完成支付，请等交付完成后再打开。</div>
               <a class="cta" href="./?ref=share">我也要问</a>`);
            return;
          }
          const s = j.summary ?? {};
          const rows = s.kind === 'quest'
            ? `<tr><td class="k">交付物</td><td class="v">场景任务 · ${esc(s.title ?? '')}</td></tr>
               <tr><td class="k">站点</td><td class="v num">${esc(s.checkpoints)} 站</td></tr>
               <tr><td class="k">总里程</td><td class="v num">${esc(s.total_distance_m)} m</td></tr>`
            : `<tr><td class="k">路线</td><td class="v">${esc(s.from)} → ${esc(s.to)}</td></tr>
               <tr><td class="k">距离</td><td class="v num">${esc(s.distance_m)} m（${esc(s.path_type) === 'walkway' ? '实测步道' : '直距估算'}）</td></tr>`;
          $(`
            <div class="badge ok">✓ 已核验 · 支付宝 A2M 履约完成</div>
            <h1>${esc(j.scene ?? '')}${j.scene ? ' · ' : ''}导览服务</h1>
            <div class="goods">${esc(j.goods_name)}</div>
            <table>
              ${rows}
              <tr><td class="k">实付金额</td><td class="v amount num">¥${esc(j.amount)} ${esc(j.currency)}</td></tr>
              <tr><td class="k">交易号</td><td class="v mono num">${esc(j.trade_no_masked)}（尾号，已脱敏）</td></tr>
              <tr><td class="k">履约时间</td><td class="v num">${esc(String(j.fulfilled_at ?? '').slice(0, 19).replace('T', ' '))} UTC</td></tr>
              <tr><td class="k">证据哈希</td><td class="v hash">${esc(j.evidence?.geometryHash ?? '—')}</td></tr>
              <tr><td class="k">用量</td><td class="v num">${esc(Object.entries(j.usage ?? {}).map(([k, v]) => `${k} ${v}`).join(' · ') || '—')}</td></tr>
            </table>
            <div class="explain">
              这张卡由商家服务端出具：<b>证据哈希</b>覆盖真实路网拓扑的节点与边，
              任何人可复算；交易号已脱敏，卡上不含任何个人信息。
              完整路线内容仍属付费交付——核验的是「这笔交易真实发生」，不是内容本身。
            </div>
            <a class="cta" href="./?ref=share">${esc(j.cta?.message ?? '我也要问')}</a>
            <div class="foot">三维问路 SceneGuide · PAYATHON 2026 · OpenStreetMap © OSM contributors (ODbL)</div>`);
        })
        .catch(() => $('<div class="err">核验服务暂时不可用，请稍后再试。</div>'));
    }
  </script>
</body>
</html>
