<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a5870"/>
    </marker>
    <marker id="arrowg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0e7a63"/>
    </marker>
  </defs>

  <!-- 买方 Agent -->
  <rect x="24" y="60" width="200" height="150" rx="12" fill="#f2f7f5" stroke="#0e7a63" stroke-width="1.5"/>
  <text x="124" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#16202e">消费者 Agent</text>
  <text x="124" y="118" text-anchor="middle" font-size="11.5" fill="#4a5870">MCP tools/list 发现</text>
  <text x="124" y="138" text-anchor="middle" font-size="11.5" fill="#4a5870">scene_guide (paid=true)</text>
  <text x="124" y="164" text-anchor="middle" font-size="11.5" fill="#4a5870">→ 引导用户付款</text>
  <text x="124" y="184" text-anchor="middle" font-size="11.5" fill="#4a5870">→ 携 Proof 重试</text>

  <!-- 商家服务端 -->
  <rect x="380" y="34" width="260" height="200" rx="12" fill="#eef4ff" stroke="#2f7bff" stroke-width="1.5"/>
  <text x="510" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#16202e">商家服务端（本作品）</text>
  <rect x="398" y="76" width="110" height="34" rx="7" fill="#fff" stroke="#2f7bff"/>
  <text x="453" y="98" text-anchor="middle" font-size="11.5" fill="#16202e">402 挑战（RSA2）</text>
  <rect x="516" y="76" width="106" height="34" rx="7" fill="#fff" stroke="#2f7bff"/>
  <text x="569" y="98" text-anchor="middle" font-size="11.5" fill="#16202e">五项核验</text>
  <rect x="398" y="118" width="110" height="34" rx="7" fill="#fff" stroke="#2f7bff"/>
  <text x="453" y="140" text-anchor="middle" font-size="11.5" fill="#16202e">幂等履约</text>
  <rect x="516" y="118" width="106" height="34" rx="7" fill="#fff" stroke="#2f7bff"/>
  <text x="569" y="140" text-anchor="middle" font-size="11.5" fill="#16202e">履约回执</text>
  <rect x="398" y="160" width="110" height="34" rx="7" fill="#fff" stroke="#2f7bff"/>
  <text x="453" y="182" text-anchor="middle" font-size="11.5" fill="#16202e">权益台账</text>
  <rect x="516" y="160" width="106" height="34" rx="7" fill="#fff" stroke="#2f7bff"/>
  <text x="569" y="182" text-anchor="middle" font-size="11.5" fill="#16202e">四维计量</text>
  <text x="510" y="216" text-anchor="middle" font-size="11" fill="#8a94a8">订单先落库 · SQLite 状态机 · 证据哈希</text>

  <!-- 支付宝 -->
  <rect x="740" y="60" width="196" height="150" rx="12" fill="#f2f7f5" stroke="#0e7a63" stroke-width="1.5"/>
  <text x="838" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#16202e">支付宝沙箱收银</text>
  <text x="838" y="118" text-anchor="middle" font-size="11.5" fill="#4a5870">buyer 支付 → trade_no</text>
  <text x="838" y="138" text-anchor="middle" font-size="11.5" fill="#4a5870">payment.verify 验付</text>
  <text x="838" y="164" text-anchor="middle" font-size="11.5" fill="#4a5870">fulfillment.confirm 回执</text>
  <text x="838" y="184" text-anchor="middle" font-size="11.5" fill="#4a5870">A2M 智能收 · HTTP 402</text>

  <!-- 数据层 -->
  <rect x="380" y="330" width="260" height="120" rx="12" fill="#fff8ef" stroke="#c98a2b" stroke-width="1.5"/>
  <text x="510" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#16202e">交付物（HTTP 200）</text>
  <text x="510" y="384" text-anchor="middle" font-size="11.5" fill="#4a5870">真实步道路线 + geometryHash</text>
  <text x="510" y="404" text-anchor="middle" font-size="11.5" fill="#4a5870">研学任务：线索链 → 打卡 → 证书</text>
  <text x="510" y="424" text-anchor="middle" font-size="11.5" fill="#4a5870">核验卡：脱敏 + 可分享</text>

  <!-- 连线 -->
  <path d="M224 110 C 300 110, 310 100, 376 100" fill="none" stroke="#4a5870" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="298" y="94" text-anchor="middle" font-size="11" fill="#4a5870">GET /api/v1/guide</text>
  <path d="M376 130 C 300 130, 310 140, 224 140" fill="none" stroke="#0e7a63" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <text x="298" y="156" text-anchor="middle" font-size="11" fill="#0e7a63">402 → 支付 → 200 资源</text>

  <path d="M640 100 C 700 100, 690 110, 736 110" fill="none" stroke="#4a5870" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="688" y="94" text-anchor="middle" font-size="11" fill="#4a5870">沙箱收银</text>
  <path d="M736 160 C 700 160, 690 150, 644 150" fill="none" stroke="#0e7a63" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <text x="688" y="176" text-anchor="middle" font-size="11" fill="#0e7a63">verify + confirm</text>

  <path d="M510 234 L 510 326" fill="none" stroke="#4a5870" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="286" text-anchor="middle" font-size="11" fill="#4a5870">交付</text>

  <text x="124" y="330" text-anchor="middle" font-size="11.5" fill="#8a94a8">MDN 端点</text>
  <text x="124" y="352" text-anchor="start" font-size="11" fill="#4a5870">POST /mcp（JSON-RPC）</text>
  <text x="124" y="372" text-anchor="start" font-size="11" fill="#4a5870">GET /api/v1/verify/:订单</text>
  <text x="124" y="392" text-anchor="start" font-size="11" fill="#4a5870">GET /llms.txt · GET /api/v1/growth</text>
  <text x="124" y="412" text-anchor="start" font-size="11" fill="#4a5870">GET /api/v1/entitlements</text>
</svg>
