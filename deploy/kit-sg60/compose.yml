# 三维问路 SceneGuide（PAYATHON 2026）—— 60.205.204.162
#
# 内存约束：这台 2G 机器可用内存约 300MB。
#   → 镜像在**本机构建**（Dockerfile 已把 node_modules 烤进去），容器启动不跑 npm ci；
#   → 容器内存上限 256MB、Node 堆上限 128MB，给宿主留出余量；
#   → 依赖卷只放 node_modules（体积大但内存不吃），场景数据已烤进镜像。
services:
  sceneguide:
    image: sceneguide:1.0
    container_name: sceneguide
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=128
      ALIPAY_SELLER_NAME: 三维问路
      SCENE_DIR: /app/scenes
      ANALYTICS_DB: /app/data/analytics.db
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      # 只挂数据库目录：场景数据在镜像里 /app/scenes，挂载不可能遮蔽它
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
