# HTTPS 站点模板（备案通过后启用）
#
# 为什么单独放一个文件：现网 80 端口是共享 nginx（还跑着 /campus、/cjy 等项目），
# 只能以 location 片段接入；而 HTTPS 必须落在**自己的 server 块**里（证书按域名绑定），
# 不能继续寄生在别人的 server 块中。这个文件就是那块 server 的模板。
#
# 启用方式（一条命令，域名与证书由 certbot 自动办理）：
#   sudo bash deploy/https/enable-https.sh <你的域名>
#
# 启用后：
#   - 80 端口只做 301 跳转到 https
#   - 443 提供本站（/sceneguide/ 反代到 127.0.0.1:3001）
#   - 证书由 certbot 自动续期（systemd timer）
#   - 安全上下文成立 → PWA 可一键安装、Service Worker 生效、热度榜链接不再被浏览器标「不安全」

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    # ACME 校验与跳转：certbot 的 webroot 校验走 80，其余一律跳 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 安全响应头（应用层已有一份，这里再兜一层，防的是同机其他 location 的回归）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 站点本体：与 80 时代的 location 片段保持一致（前缀 /sceneguide/，反代回环端口）
    location /sceneguide/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 沙箱支付链路最长 ~90s
    }
}
