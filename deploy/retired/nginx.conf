# ╠🟥🟥 已退役，勿用（2026-11-21 标注）🟥🟥
# 这是「裸机 systemd + 根路径部署」时代的站点模板，与现网 Compose 布局完全不符：
#   · 现网是 Docker Compose（kit-sg60/compose.yml），对外只挂 /sceneguide/ 子路径；
#   · 本文件写 listen 80 + server_name _ + root 指向 /opt/sceneguide/...，
#     且自称「端口 3100 与 sceneguide.service 的 PORT 一致」——而 service 文件实际是 3000。
# 现可用的两份配置：
#   · 子路径 location 片段：kit-sg60/nginx-sceneguide.conf
#   · HTTPS server 块模板：https/nginx-https.conf（备案通过后配 enable-https.sh 用）
# 保留本文件仅作历史记录。
#
# SceneGuide nginx 配置（示例端口 3100，与 sceneguide.service 的 PORT 一致）
# 放到 /etc/nginx/sites-available/sceneguide 并软链到 sites-enabled/
# 备案通过后运行 `sudo certbot --nginx -d <域名>` 即可自动补上 443/TLS

server {
    listen 80;
    server_name _;   # 备案通过后改成你的域名

    # ── 基础安全头 ────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── 静态资源：直接由 nginx 服（node 只承担 API）────────────
    root /opt/sceneguide/scene-guide/public;
    index index.html;

    # 站点 JS 就是演示本体，与 node 侧一致使用 no-cache（ETag 协商）
    location ~* \.(js|css|html|json|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(png|jpg|webp|ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── API 与 MCP：反代到 node ───────────────────────────────
    location ~ ^/(api|mcp|healthz) {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── SPA 入口与 404 ────────────────────────────────────────
    location / {
        try_files $uri $uri/ @node;
    }
    location @node {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 私钥与数据目录绝不可被直接访问
    location ~ ^/(\.alipay-sandbox|config|data/orders\.db) {
        deny all;
    }
}
